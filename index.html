function render(){nav();const path=location.hash.slice(1)||'/';if(path.startsWith('/lessons')&&!role){location.hash='/login?next='+encodeURIComponent(path);return}if(path==='/'||path.startsWith('/?')){main.innerHTML='<div class="original-landing"><section class="hero"><div class="eyebrow">Engineering is better hands-on. / Introducing</div><h1>HELPING<span>HAND</span></h1><div class="hero-art" id="hero-art"></div><div class="tag">01 / MODULAR ROBOTICS<br><br>DESIGNED TO BE DISCOVERED</div><div class="hero-bottom"><div><div class="eyebrow">Small parts. Big possibilities.</div><p>A modular robotic hand for the next generation of engineers. Build it. Understand it. Make it move.</p></div><a class="circle" href="#/lessons" aria-label="Explore HelpingHand">↓</a><div class="eyebrow">HandiWorks Co.<br><br>NYU Tandon / 2026</div></div></section><div class="strip"><div>BUILD. CODE. DISCOVER. ↗ &nbsp; ENGINEERING IN YOUR HANDS. ↗ &nbsp; BUILD. CODE. DISCOVER. ↗ &nbsp; ENGINEERING IN YOUR HANDS. ↗ &nbsp; BUILD. CODE. DISCOVER. ↗</div></div><section id="about" class="content dark intro"><div class="eyebrow">01 / A helping hand</div><div><p class="statement visible">Big ideas start<br>with a little<br><em>hands-on thinking.</em></p><p class="sub">HelpingHand brings mechanics, electronics, and programming together in one modular robotics project. A tangible way for students to explore how engineering turns an idea into movement.</p></div></section><section id="product" class="content"><div class="section-head"><div><div class="eyebrow">02 / Meet the mechanism</div><h2>ENGINEERED FOR<br>HANDS-ON LEARNING.</h2></div><p class="eyebrow">Discover your first lesson ↙</p></div><div class="lab"><div class="demo" id="demo"><div id="demo-art"></div><a class="pill" href="#/login">Start learning ↗</a><div class="controls" style="display:none"><button class="active" data-state="open" aria-pressed="true">Open hand ↗</button><button data-state="closed" aria-pressed="false">Close hand ↙</button></div><div class="caption" aria-live="polite" id="status">Concept illustration · open position · motion is illustrative</div></div><div class="features"><article class="feature visible"><b>01 / MECHANICS</b><h3>Small links. Coordinated movement.</h3><p>The proposed fingers use a scissor mechanism. Explore how connected links translate motion through each finger.</p></article><article class="feature visible"><b>02 / ELECTRONICS</b><h3>A little power. A lot to explore.</h3><p>An Arduino Mega, six positional servos, and a three-axis gyroscope/accelerometer form the planned electronic system.</p></article><article class="feature visible"><b>03 / PROGRAMMING</b><h3>From your code to its fingertips.</h3><p>Open and close inputs guide the hand toward its target position. The proposed control logic includes fault checks and LED status feedback.</p></article></div></div></section><section id="learn" class="content build"><div><div class="eyebrow">03 / Learning through making</div><h2>LEARN THROUGH<br>EXPERIMENTATION.</h2><p>Designed for students learning engineering and robotics. Follow the connections from physical parts to circuits to the code that brings them together.</p></div><div class="steps"><div class="step"><span>01</span><div><strong>Discover the parts.</strong><p>Get to know the fingers, palm, base, and mechanical linkages.</p></div></div><div class="step"><span>02</span><div><strong>Connect the ideas.</strong><p>Explore how the controller, power supply, sensors, and servos work together.</p></div></div><div class="step"><span>03</span><div><strong>Make your next move.</strong><p>Investigate the control logic. Test, observe, and use what you learn to improve the design.</p></div></div></div></section><section id="team" class="content dark"><div class="eyebrow">04 / The hands behind the hand</div><h2>MEET HANDIWORKS.</h2><p style="color:#adb4a2;max-width:510px;line-height:1.7;margin-bottom:55px">Four students. One shared curiosity. Created for EG-UY 1004 at NYU Tandon School of Engineering.</p><div class="team"><article class="person visible"><div class="initial">Bj.</div><h3>Billy Jin</h3><p>Programming Lead</p></article><article class="person visible"><div class="initial">Gk.</div><h3>Golam Khan</h3><p>Design Lead</p></article><article class="person visible"><div class="initial">Cl.</div><h3>Clarence Li</h3><p>Circuitry Lead</p></article><article class="person visible"><div class="initial">Lz.</div><h3>Lingbo Zhang</h3><p>Project Manager</p></article></div></section><footer class="footer"><div class="eyebrow">Your next big idea starts here.</div><h2>YOUR NEXT IDEA.<br>IN YOUR HANDS.</h2><a class="pill" href="#/login">Enter the learning lab ↗</a><div class="footer-bottom"><span>© 2026 HANDIWORKS CO.</span><span>HELPINGHAND / PROPOSED EDUCATIONAL PROTOTYPE</span><a href="#/">BACK TO TOP ↑</a></div></footer></div>';document.getElementById('hero-art').innerHTML=originalSvg;document.getElementById('demo-art').innerHTML=originalSvg}
else if(path.startsWith('/login')){const params=new URLSearchParams(path.split('?')[1]);main.innerHTML=`<section class="auth"><p class="eyebrow">Welcome to HelpingHand</p><h1>Enter the learning lab.</h1>${params.has('loggedOut')?'<p role="status">You’ve exited the demo.</p>':''}<p>Walk through the learning experience as a student or see the extra teaching guidance.</p><div class="role-options"><button data-role="student">Explore as a student →</button><button data-role="teacher" class="secondary">Explore as a teacher →</button></div><p class="muted">This preview uses simulated roles. No email or password is collected. The full app uses teacher-provided accounts.</p></section>`;document.querySelectorAll('[data-role]').forEach(b=>b.onclick=()=>{role=b.dataset.role;const next=params.get('next');location.hash=next?.startsWith('/lessons')?next:'/lessons'})}

function lesson(){const sections=['How a finger moves','Meet the parts','Safety first','Assemble the finger','Wire it up','Program it','Test your finger','Check your understanding',...(role==='teacher'?['Teacher notes']:[]),'Go further','Downloads'];main.innerHTML=`<a href="#/lessons">← Lessons</a><p class="eyebrow">Lesson 1</p><h1>Build a Finger Module</h1><p><span class="badge">Beginner</span> · 90 min · Guided preview</p><div class="lesson-grid"><article class="lesson"><aside class="callout"><h2>Expected outcome</h2><p>A finger that closes on one button press and opens on the next, once the final hardware and sketch are validated.</p></aside><h2>You will be able to</h2><ul><li>Identify the links and joints in a finger module.</li><li>Check a mechanism for free movement before powering it.</li><li>Explain how a button changes the requested position.</li></ul><h2>Materials</h2><table><thead><tr><th>Item</th><th>Quantity</th></tr></thead><tbody>${['Printed finger kit','Motor and approved driver','Arduino board and USB cable','Push button','Fastener kit'].map(m=>`<tr><td>${m}</td><td>1</td></tr>`).join('')}</tbody></table><aside class="callout"><strong>Hardware review pending</strong><p>Final CAD, assembly photos, pin assignments, and validated code are needed before this lesson can be used to build the physical hand.</p></aside>${sections.map((t,i)=>`<section id="s${i}"><h2>${t}</h2>${body(t)}</section>`).join('')}<p><a href="#/lessons">← Back to lessons</a> · Lesson 2 coming soon</p></article><aside class="toc"><strong>On this page</strong>${sections.map((t,i)=>`<a href="#s${i}" data-scroll="s${i}">${t}</a>`).join('')}</aside></div>`;document.querySelectorAll('[data-scroll]').forEach(a=>a.onclick=e=>{e.preventDefault();document.getElementById(a.dataset.scroll).scrollIntoView({behavior:'auto'})});const slider=document.querySelector('#angle');slider.oninput=()=>{document.querySelector('#part').setAttribute('transform',`translate(180 110) rotate(${slider.value})`);document.querySelector('#degrees').textContent=slider.value+'°'};document.querySelector('#reset').onclick=()=>{slider.value=0;slider.dispatchEvent(new Event('input'))};document.querySelector('#quiz').onsubmit=e=>{e.preventDefault();const answers=new FormData(e.target);let score=0;['rotate','binding','multiple','stop','target'].forEach((x,i)=>score+=answers.get('q'+i)===x);document.querySelector('#result').textContent=`You answered ${score} of 5 correctly. Review the lesson and try again.`};document.querySelector('#copy').onclick=async()=>{try{await navigator.clipboard.writeText(document.querySelector('#code').textContent);document.querySelector('#copy').textContent='Copied'}catch{document.querySelector('#copy').textContent='Select the code below to copy'}};document.querySelectorAll('.check input').forEach(c=>c.onchange=()=>{document.querySelector('#checks').textContent=`${document.querySelectorAll('.check input:checked').length} of 3 checks complete`})}
function body(t){switch(t){case 'How a finger moves':return '<p>A linkage connects rigid parts at pivot points. Moving one link changes the position of the others. The proposed finger uses coupled four-bar linkages. Compare its pivots with your own knuckles.</p>';case 'Meet the parts':return `<p>The kit is planned to include phalanges, a gear housing, and rack-and-pinion components. This interactive illustration lets you inspect a sample link; it is not the final STL model.</p><div class="viewer"><svg viewBox="0 0 360 220" role="img" aria-label="Rotatable concept illustration of a mechanical link"><g id="part" transform="translate(180 110)"><rect x="-115" y="-25" width="230" height="50" rx="25" fill="var(--hh-part)" stroke="var(--hh-primary)" stroke-width="3"/><circle cx="-85" cy="0" r="12" fill="var(--hh-bg)"/><circle cx="85" cy="0" r="12" fill="var(--hh-bg)"/><path d="M-55 0h110" stroke="var(--hh-accent)" stroke-width="4"/></g></svg><label for="angle">Rotate illustration <output id="degrees">0°</output></label><input id="angle" type="range" min="-180" max="180" value="0"><button id="reset" class="secondary">Reset view</button><p class="muted">Concept illustration · final 3D part pending</p></div>`;case 'Safety first':return '<aside class="callout safety"><strong>Disconnect power before adjustments.</strong><p>Keep fingers clear of pinch points. Use tools and hot glue with your teacher’s supervision. Stop immediately if a mechanism binds or overheats.</p></aside>';case 'Assemble the finger':return '<p>This planning sequence awaits the approved drawings and photos.</p><ol>'+['Identify parts against the final bill of materials.','Inspect printed parts for damage.','Identify the proximal and distal sections.','Locate pivot points in the approved drawing.','Fit the specified linkage hardware.','Fit the approved drive housing and components.','Check that fasteners retain joints without clamping them rigidly.','With power disconnected, move the mechanism gently by hand.','Correct rubbing or binding before proceeding.','Ask your teacher to review the assembly.'].map(x=>'<li>'+x+'</li>').join('')+'</ol>';case 'Wire it up':return '<p>The final wiring diagram and Tinkercad project are pending confirmation of the motor, driver, supply voltage, and pin assignments.</p><div class="card"><strong>Wiring preview coming soon</strong><p>No wiring connections should be inferred from this preview.</p></div>';case 'Program it':return '<p>This pseudocode demonstrates the intended behavior; it is not an uploadable Arduino sketch.</p><button class="secondary" id="copy">Copy pseudocode</button><pre><code id="code">start with an open target\nread the debounced button\nwhen a new press is detected:\n    switch between open and closed targets\nif a fault is detected:\n    stop the motor\notherwise:\n    move toward the target within validated limits</code></pre>';case 'Test your finger':return '<p>After your teacher approves the hardware and sketch, verify each check.</p>'+['Full open and closed travel','Smooth motion with no binding','Ten successful cycles in a row'].map(x=>`<label class="check"><input type="checkbox">${x}</label>`).join('')+'<p id="checks" role="status">0 of 3 checks complete</p>';case 'Check your understanding':return `<p>Try these sample questions. Results stay in this preview and are not saved.</p><form id="quiz">${[['What does a pivot joint allow?','rotate','Relative rotation','fixed','Permanent fixation'],['Why check movement before powering?','binding','To catch binding','speed','To increase speed'],['What does debouncing prevent?','multiple','Multiple events from one press','power','Power consumption'],['What should happen during a fault?','stop','Stop the motor','faster','Move faster'],['How would you request halfway travel?','target','Change the target within safe limits','voltage','Guess a higher voltage']].map(([q,a,at,b,bt],i)=>`<label style="display:block;margin:20px 0">${i+1}. ${q}<br><select name="q${i}" required><option value="">Choose an answer</option><option value="${a}">${at}</option><option value="${b}">${bt}</option></select></label>`).join('')}<button>Check answers</button><p id="result" class="result" role="status">Choose an answer for each question.</p></form>`;case 'Teacher notes':return '<aside class="callout teacher"><span class="badge">Sample teacher view</span><h3>Timing guide</h3><p>Parts tour: 10 minutes. Assembly: 40 minutes. Wiring and code: 30 minutes. Testing and reflection: 10 minutes. Confirm timing against the actual classroom period.</p><h3>Assessment</h3><p>Look for clear explanations of pivots, careful assembly, safe testing, and the ability to interpret unexpected motion.</p><h3>Answer key</h3><p>Relative rotation; catch binding; prevent multiple events; stop the motor; change the target within validated limits.</p></aside>';case 'Go further':return '<p>Explain how a halfway target differs from fully open or closed. What would you measure before changing the target?</p>';default:return '<p>Final CAD and the validated Arduino sketch will appear here when supplied by the hardware team.</p>'}}
window.addEventListener('hashchange',render);render();
