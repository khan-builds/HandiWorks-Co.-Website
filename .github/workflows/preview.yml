name: Website preview
on:
  push:
    branches: [main]
    paths: ['index.html', '.github/workflows/preview.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: website-preview
  cancel-in-progress: true

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare static demo only
        run: |
          mkdir -p _site
          cp index.html _site/index.html
          touch _site/.nojekyll
          node -e "const fs=require('fs');const s=fs.readFileSync('_site/index.html','utf8');const match=s.match(/<script>([\\s\\S]*)<\\/script>/);if(!match)throw Error('Missing preview script');new Function(match[1]);"
      - name: Downloadable preview
        uses: actions/upload-artifact@v4
        with:
          name: helpinghand-preview
          path: _site/
          retention-days: 14
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: package
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check Pages configuration
        id: pages
        continue-on-error: true
        uses: actions/configure-pages@v5
      - name: Publish browser preview
        if: steps.pages.outcome == 'success'
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Setup instructions
        if: steps.pages.outcome != 'success'
        run: |
          echo '### Preview packaged; Pages setup is needed' >> "$GITHUB_STEP_SUMMARY"
          echo 'Open Settings > Pages and set Source to GitHub Actions, then run this workflow again. Private repositories require a GitHub plan that supports Pages. A downloadable helpinghand-preview artifact is available in the package job.' >> "$GITHUB_STEP_SUMMARY"
